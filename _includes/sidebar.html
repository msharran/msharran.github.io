{%- assign current_path = page.url | default: '/' -%}
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Sharran M, home">SM<span aria-hidden="true"> / </span><span class="brand-name">Sharran M</span></a>
  <nav class="site-nav" aria-label="Main navigation">
    {% assign paths = '/,/devlog/,/notes/,/profile/' | split: ',' %}
    {% assign labels = 'Intro,Devlog,Notes,Profile' | split: ',' %}
    {% for path in paths %}
    <a href="{{ path | relative_url }}"{% if current_path == path or path != '/' and current_path contains path %} aria-current="page"{% endif %}>{{ labels[forloop.index0] }}</a>
    {% endfor %}
  </nav>
  <button class="theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false" hidden><span class="toggle-track" aria-hidden="true"></span><span class="theme-label">Light</span></button>
</header>
